services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: chernozem
      POSTGRES_USER: chernozem
      POSTGRES_PASSWORD: chernozem_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgis-data:
